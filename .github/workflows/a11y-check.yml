name: Accessibility CI Gatekeeper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pa11y-check:
    name: Run pa11y-ci
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      # ⚡ Bolt Optimization: Batch install required CLI tools.
      # Installing ajv-cli here prevents npx from having to dynamically resolve,
      # download, and setup a temporary environment for it during the validation step.
      run: npm install --no-save pa11y-ci ajv-cli

    - name: Validate pa11y config
      run: |
        npx ajv-cli validate -s schemas/pa11yci.schema.json -d .pa11yci.json

    # In a real project, you would build the site and serve it locally before running pa11y,
    # or point it at specific static files. Here we test our baseline examples.
    - name: Run Accessibility Tests
      run: npx pa11y-ci examples/*.html --config .pa11yci.json
