name: Accessibility CI Gatekeeper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pa11y-check:
    name: Run pa11y-ci
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      # ⚡ Bolt Optimization: Batch install required CLI tools.
      # Installing ajv-cli here prevents npx from having to dynamically resolve,
      # download, and setup a temporary environment for it during the validation step.
      run: npm install --no-save pa11y-ci ajv-cli puppeteer

    - name: Validate pa11y config
      run: |
        npx --no-install ajv-cli validate -s schemas/pa11yci.schema.json -d .pa11yci.json

    # In a real project, you would build the site and serve it locally before running pa11y,
    # or point it at specific static files. Here we test our baseline examples.
    - name: Run Accessibility Tests
      run: npx --no-install pa11y-ci --config .pa11yci.json

    - name: Verify Content Security Policy
      run: |
        node << 'JS'
        const puppeteer = require('puppeteer');
        const path = require('path');

        (async () => {
          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          const page = await browser.newPage();

          let errors = 0;

          page.on('console', msg => {
            if (msg.type() === 'error') {
              console.error(`Console Error: ${msg.text()}`);
              errors++;
            }
          });

          page.on('pageerror', err => {
            console.error(`Page Error: ${err.message}`);
            errors++;
          });

          page.on('requestfailed', request => {
            console.error(`Request Failed: ${request.url()} - ${request.failure().errorText}`);
            errors++;
          });

          // Wait until network is idle to capture CSP blocks
          const fileUrl = `file://${path.resolve(process.cwd(), 'examples/web-baseline.html')}`;
          console.log(`Checking ${fileUrl}...`);

          try {
            await page.goto(fileUrl, { waitUntil: 'networkidle0' });

            // Give it a tiny bit of time to report CSP violations
            await new Promise(r => setTimeout(r, 1000));

          } catch (e) {
            console.error(`Failed to load page: ${e}`);
            errors++;
          }

          await browser.close();

          if (errors > 0) {
            console.error(`Failed with ${errors} errors. CSP or console issues detected.`);
            process.exit(1);
          } else {
            console.log('No console errors or CSP violations detected.');
            process.exit(0);
          }
        })();
        JS

  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --no-save ajv-cli markdown-link-check@3.14.2

    - name: Run build script test
      run: bash ./test-build-agent-context.sh

    - name: Validate design tokens against schema
      run: npx --no-install ajv-cli validate -s schemas/tokens.schema.json -d principles/tokens.screen.json -d principles/tokens.print-monochrome.json --spec=draft7

    - name: Check agent-instructions.md is up to date
      run: |
        ./build-agent-context.sh
        git diff --exit-code -- agent-instructions.md || (echo "agent-instructions.md is out of date. Run ./build-agent-context.sh and commit the result." && exit 1)

    - name: Check markdown links
      run: |
        status=0
        while IFS= read -r -d '' f; do
          npx --no-install markdown-link-check -c .markdown-link-check.json -q "$f" || status=1
        done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -print0)
        exit $status
      shell: bash
