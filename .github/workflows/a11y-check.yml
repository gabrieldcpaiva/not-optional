name: Accessibility CI Gatekeeper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pa11y-check:
    name: Run pa11y-ci
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --no-save pa11y-ci

    # In a real project, you would build the site and serve it locally before running pa11y,
    # or point it at specific static files. Here we test our baseline examples.
    - name: Run Accessibility Tests
      run: npx pa11y-ci examples/*.html --config .pa11yci.json
