name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Which file, skill, or example?
      description: Specify the file or context where the bug occurs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What browser, agent, or tool are you using?
    validations:
      required: true
  - type: textarea
    id: extra-context
    attributes:
      label: Optional extra context
      description: Anything else you want to share?
    validations:
      required: false
