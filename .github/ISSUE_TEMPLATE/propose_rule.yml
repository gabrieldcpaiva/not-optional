name: Propose a rule
description: Propose a new rule with evidence
title: "[Rule Proposal]: "
labels: ["rule proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and who it helps
      description: Explain what problem this rule solves and who it helps.
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: The proposed rule
      description: State the proposed rule in one sentence.
    validations:
      required: true
  - type: input
    id: threshold
    attributes:
      label: Number or threshold
      description: Provide a measurable number (e.g., ratio, px/pt/mm, word/line count, timing).
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Source or evidence
      description: Provide a source for the number (WCAG, research paper, standard, documented testing).
    validations:
      required: true
  - type: dropdown
    id: medium
    attributes:
      label: Medium
      description: Which medium does this apply to?
      options:
        - web
        - print
        - both
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Good/bad example
      description: Provide a short good and bad example of this rule.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I confirm that I have included evidence/source for the number/threshold.
          required: true
